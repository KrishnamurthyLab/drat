<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 • Krishnamurthy Lab DRAT</title>
    <!-- Auto-redirect to KrishnamurthyLab GitHub after 8 seconds -->
    <meta http-equiv="refresh" content="8;url=https://github.com/KrishnamurthyLab">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        body { font-family: 'Inter', system_ui, sans-serif; }
        .title-font { font-family: 'Space Grotesk', sans-serif; }
        .error-bg { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); }
        .glitch { animation: glitch 0.6s infinite alternate; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-4px, 4px); }
            40% { transform: translate(-4px, -4px); }
            60% { transform: translate(4px, 4px); }
            80% { transform: translate(4px, -4px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen flex items-center">
    <div class="error-bg w-full min-h-screen flex items-center">
        <div class="max-w-2xl mx-auto px-6 text-center">
            <div class="mb-8 flex justify-center">
                <div class="relative">
                    <div class="text-[180px] leading-none font-black text-zinc-800 title-font tracking-tighter select-none">404</div>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="text-8xl glitch">🐱</div>
                    </div>
                </div>
            </div>

            <h1 class="title-font text-6xl font-bold tracking-tighter mb-4">drat.</h1>
            <p class="text-3xl text-zinc-400 mb-6 font-light">Page not found</p>

            <p class="text-zinc-400 mb-10 max-w-md mx-auto">
                Redirecting you to the <span class="text-emerald-400">KrishnamurthyLab</span> repositories in a few seconds...
            </p>
        </div>
    </div>
</body>
</html>
